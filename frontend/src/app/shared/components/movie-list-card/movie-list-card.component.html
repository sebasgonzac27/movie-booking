<article class="movie-list-card">
  <img [src]="movie.cover" alt="Movie cover" class="movie-list-card__cover" />
  <div class="movie-list-card__info">
    <app-typography class="movie-list-card__title" [bold]="true">{{
      movie.title
    }}</app-typography>
    <div class="movie-list-card__details">
      <lucide-icon [img]="Clapperboard" size="18"></lucide-icon>
      <p>{{ genres }}</p>
    </div>
    <div class="movie-list-card__details">
      <lucide-icon [img]="Languages" size="18"></lucide-icon>
      <p>{{ languages }}</p>
    </div>
    <div class="movie-list-card__details">
      <lucide-icon [img]="CalendarDays" size="18"></lucide-icon>
      <p>{{ releaseDate }}</p>
    </div>
  </div>
</article>

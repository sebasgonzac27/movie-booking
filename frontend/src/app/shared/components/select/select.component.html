<div class="select-container">
  <app-typography type="label">{{ label }}</app-typography>
  <select
    class="select"
    [id]="id"
    [name]="name"
    [multiple]="multiple"
    [value]="value ? value : options[0].value"
    (change)="handleInput($event)"
  >
    <option
      class="option"
      *ngFor="let option of options"
      [value]="option.value"
    >
      {{ option.label }}
    </option>
  </select>
</div>

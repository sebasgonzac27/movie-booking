<div class="input-container">
  <app-typography *ngIf="label" type="label">{{ label }}</app-typography>
  <div class="input-wrapper">
    <input
      class="input"
      [id]="id"
      [name]="name"
      [placeholder]="placeholder"
      [type]="type"
      [disabled]="disabled"
      [value]="value"
      (input)="handleInput($event)"
    />
    <lucide-icon
      [img]="Search"
      size="20"
      class="input-icon"
      *ngIf="type === 'search'"
    ></lucide-icon>
  </div>
</div>

<app-layout name="Movies" variant="secondary">
  <main main>
    <app-input
      placeholder="Search for a movie"
      type="search"
      [formControl]="searchControl"
    ></app-input>

    <section class="movie-list">
      <app-movie-list-card
        *ngFor="let movie of movies"
        [movie]="movie"
      ></app-movie-list-card>
    </section>
  </main>
</app-layout>

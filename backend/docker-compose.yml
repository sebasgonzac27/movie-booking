version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: movie_booking
      MYSQL_USER: user_movie
      MYSQL_PASSWORD: admin123*
    volumes:
      - ./mysql:/var/lib/mysql
    ports:
      - '3306:3306'
